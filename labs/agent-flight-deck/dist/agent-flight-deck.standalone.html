<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Agent Flight Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Replay and audit Claude Code sessions, and pack a codebase into a prompt under a token budget. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell (header + one instrument view); each view is a grid of panels that stacks to one column on phones.
   Look: avionics instrument panel — cool load-sheet paper in light, deep slate cockpit in dark, signal-orange accent. */
:root {
  --bg: #eceff3;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --ink: #15202b;
  --muted: #5a6876;
  --faint: #8794a1;
  --line: #d6dde4;
  --line-2: #e6ebf0;
  --accent: #d9530b;
  --accent-ink: #ffffff;
  --accent-soft: #fbe6da;
  --good: #1d8a5f;
  --good-soft: #def2e9;
  --warn: #b7730a;
  --warn-soft: #fbefd6;
  --bad: #c9352f;
  --bad-soft: #f9e0de;
  --c-read: #2f6fde;
  --c-edit: #1d8a5f;
  --c-run: #7656d6;
  --c-web: #0b8f9b;
  --c-agent: #c23b84;
  --c-mcp: #b7730a;
  --c-other: #7d8a96;
  --c-input: #9aa7b4;
  --c-cwrite: #d9530b;
  --c-cread: #2f6fde;
  --c-output: #1d8a5f;
  --hatch: rgba(21, 32, 43, 0.07);
  --shadow: 0 1px 2px rgba(21, 32, 43, 0.06), 0 4px 16px rgba(21, 32, 43, 0.05);
  --f-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218; --panel: #121a22; --panel-2: #172029; --ink: #e4ebf1; --muted: #93a2b1; --faint: #677685;
    --line: #26323e; --line-2: #1d2832; --accent: #ff7a33; --accent-ink: #1a0d05; --accent-soft: #3a2214;
    --good: #3cc58b; --good-soft: #10291f; --warn: #f0b13d; --warn-soft: #2e2512; --bad: #ff6b62; --bad-soft: #351816;
    --c-read: #5b93ff; --c-edit: #3cc58b; --c-run: #a28bff; --c-web: #2ec4cf; --c-agent: #f06ab0; --c-mcp: #f0b13d; --c-other: #8796a5;
    --c-input: #6b7a89; --c-cwrite: #ff7a33; --c-cread: #5b93ff; --c-output: #3cc58b;
    --hatch: rgba(228, 235, 241, 0.06); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218; --panel: #121a22; --panel-2: #172029; --ink: #e4ebf1; --muted: #93a2b1; --faint: #677685;
  --line: #26323e; --line-2: #1d2832; --accent: #ff7a33; --accent-ink: #1a0d05; --accent-soft: #3a2214;
  --good: #3cc58b; --good-soft: #10291f; --warn: #f0b13d; --warn-soft: #2e2512; --bad: #ff6b62; --bad-soft: #351816;
  --c-read: #5b93ff; --c-edit: #3cc58b; --c-run: #a28bff; --c-web: #2ec4cf; --c-agent: #f06ab0; --c-mcp: #f0b13d; --c-other: #8796a5;
  --c-input: #6b7a89; --c-cwrite: #ff7a33; --c-cread: #5b93ff; --c-output: #3cc58b;
  --hatch: rgba(228, 235, 241, 0.06); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code, kbd, pre, .mono { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ── shell ───────────────────────────────────────── */
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.topbar-inner { display: flex; align-items: center; gap: 20px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; max-width: 1480px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; line-height: 1.1; }
.brand-sub { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; color: var(--muted); text-transform: none; font-weight: 400; }
.tabs { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tab {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; letter-spacing: 0.04em; font-size: 13.5px; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.tab[aria-selected="true"] .tab-dot { background: var(--accent); }
.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chip-local { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; white-space: nowrap; }
.chip-local i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--faint); }

main { max-width: 1480px; margin: 0 auto; padding-block: 18px 48px; }
.view[hidden] { display: none !important; }

/* ── generic panels & controls ───────────────────── */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel-h h2, .panel-h h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; }
.panel-h .hint { color: var(--muted); font-size: 12px; }
.panel-h .spacer { flex: 1; }
.panel-b { padding: 14px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; line-height: 1.3;
}
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel-2); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
input[type="text"], input[type="search"], input[type="number"], select, textarea {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 9px; min-width: 0; width: 100%;
}
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
label.check input { accent-color: var(--accent); width: 15px; height: 15px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.example { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.pill.model { font-family: var(--f-mono); }
.swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }

/* dropzone */
.dropbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1.5px dashed var(--line); border-radius: var(--r);
  padding: 12px 14px; background: var(--panel); margin-bottom: 14px; transition: border-color 0.15s, background 0.15s;
}
.dropbar.drag { border-color: var(--accent); background: var(--accent-soft); }
.dropbar .dz-text { flex: 1 1 260px; min-width: 0; }
.dropbar .dz-text b { font-family: var(--f-display); font-weight: 600; letter-spacing: 0.02em; }
.dropbar .dz-text small { display: block; color: var(--muted); font-size: 12px; }
.dropbar .dz-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.progress { height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; flex-basis: 100%; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.15s; }
.notice { font-size: 12.5px; color: var(--muted); flex-basis: 100%; }
.notice.err { color: var(--bad); }

/* tooltip */
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.4;
  padding: 6px 9px; border-radius: 5px; max-width: 340px; box-shadow: var(--shadow); white-space: pre-line;
}
.tip b { font-weight: 600; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--panel); padding: 8px 16px; border-radius: 6px; font-size: 13px; box-shadow: var(--shadow); }

/* ── Flight Recorder ─────────────────────────────── */
.rec-head { display: grid; gap: 10px; margin-bottom: 14px; }
.rec-title { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.rec-title h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: clamp(19px, 2.3vw, 25px); line-height: 1.2; letter-spacing: 0.01em; text-wrap: balance; flex: 1 1 420px; min-width: 0; overflow-wrap: anywhere; }
.rec-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12.5px; align-items: center; }
.rec-meta .mono { font-size: 12px; }

.gauges { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 14px; overflow: hidden; }
.gauge { padding: 11px 14px 12px; border-right: 1px solid var(--line-2); min-width: 0; }
.gauge:last-child { border-right: 0; }
.gauge .eyebrow { display: block; margin-bottom: 3px; }
.gauge .v { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.gauge .s { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge .bar { height: 4px; background: var(--line-2); border-radius: 2px; margin-top: 7px; overflow: hidden; display: flex; }
.gauge .bar i { display: block; height: 100%; }

.rec-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.rec-main { display: grid; gap: 14px; min-width: 0; }
.rec-side { display: grid; gap: 14px; min-width: 0; position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); }

/* findings */
.findings { display: grid; gap: 0; }
.finding { display: grid; grid-template-columns: 4px 1fr; gap: 0 12px; padding: 10px 14px 11px 0; border-bottom: 1px solid var(--line-2); }
.finding:last-child { border-bottom: 0; }
.finding .stripe { grid-row: span 3; border-radius: 0 2px 2px 0; }
.finding.warn .stripe { background: var(--warn); }
.finding.info .stripe { background: var(--c-read); }
.finding.good .stripe { background: var(--good); }
.finding .ft { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.finding .fd { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
.finding .fr { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
.finding .fr button { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.finding .fr button:hover { color: var(--accent); border-color: var(--accent); }
.sev { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 6px; padding: 1px 5px; border-radius: 3px; vertical-align: 1px; }
.sev.warn { background: var(--warn-soft); color: var(--warn); }
.sev.info { background: var(--panel-2); color: var(--muted); }
.sev.good { background: var(--good-soft); color: var(--good); }

/* timeline */
.tl-wrap { position: relative; overflow-x: auto; }
.tl-svg { display: block; width: 100%; min-width: 640px; height: auto; user-select: none; cursor: crosshair; touch-action: pan-y; }
.tl-svg text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.tl-svg .lane-label { font-family: var(--f-display); font-size: 10.5px; letter-spacing: 0.08em; fill: var(--faint); }
.tl-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); padding: 0 14px 12px; }
.tl-legend span { display: inline-flex; align-items: center; gap: 5px; }
.player { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line-2); }
.player input[type="range"] { flex: 1 1 200px; accent-color: var(--accent); min-width: 120px; }
.player .pos { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 92px; text-align: right; }
.play-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.play-btn:hover { filter: brightness(1.06); }

/* feed */
.feed-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.feed-tools input[type="search"] { width: 180px; flex: 1 1 160px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.filters button[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }
.feed { max-height: 560px; overflow-y: auto; overscroll-behavior: contain; }
.ev { content-visibility: auto; contain-intrinsic-size: auto 44px; display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; font-size: 13px; position: relative; }
.ev:hover { background: var(--panel-2); }
.ev.cur { background: var(--accent-soft); }
.ev.cur::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.ev.future { opacity: 0.38; }
.ev .when { font-family: var(--f-mono); font-size: 11px; color: var(--faint); padding-top: 2px; white-space: nowrap; }
.ev .body { min-width: 0; }
.ev .who { font-family: var(--f-display); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 6px; }
.ev .txt { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.ev .txt.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ev.k-prompt .who { color: var(--accent); }
.ev.k-prompt .txt { font-weight: 500; }
.ev.k-thinking .txt, .ev.k-thinking .who { color: var(--muted); font-style: italic; }
.ev.k-error .who, .ev.k-error .txt { color: var(--bad); }
.ev.k-compact .who { color: var(--warn); }
.ev.side { padding-left: 34px; }
.ev.side::after { content: "subagent"; position: absolute; left: 14px; top: 9px; font-family: var(--f-mono); font-size: 9px; color: var(--c-agent); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.05em; }
.toolline { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex-wrap: wrap; }
.toolname { font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 3px; color: #fff; white-space: nowrap; }
.toolarg { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 120px; }
.tool-err { color: var(--bad); font-size: 11.5px; font-weight: 600; }
.tool-ms { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }

/* inspector */
.insp { display: grid; gap: 12px; }
.insp h4 { margin: 0 0 4px; font-size: 11px; font-family: var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.insp pre { margin: 0; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 8px 10px; font-size: 11.5px; line-height: 1.5; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12px; }
.costbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line-2); margin-top: 6px; }
.costbar i { display: block; height: 100%; }
.empty-insp { color: var(--muted); font-size: 13px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
.tbl th.num, .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl th[data-sort] { cursor: pointer; }
.tbl th[data-sort]:hover { color: var(--ink); }
.tbl th.sorted::after { content: " ↓"; }
.tbl th.sorted.asc::after { content: " ↑"; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--panel-2); }
.tbl .path { font-family: var(--f-mono); font-size: 12px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.tbl .ttl { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minibar { height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; min-width: 60px; display: flex; }
.minibar i { display: block; height: 100%; }

.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.chart-svg { display: block; width: 100%; height: auto; }
.chart-svg text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }

.fleet { display: grid; gap: 14px; margin-bottom: 14px; }
.fleet-kpis { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
.fleet-kpis div { display: grid; }
.fleet-kpis b { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.back { margin-bottom: 10px; }

/* ── Load Sheet ──────────────────────────────────── */

<script>
// ── pricing.js
/* Agent Flight Deck — model pricing and context windows.
 * Prices are USD per million tokens, Anthropic first-party API list prices (checked against platform.claude.com/docs/en/about-claude/pricing, 2026-11).
 * Cache writes: 1.25x input (5-minute TTL), 2x input (1-hour TTL). Cache reads vary by model.
 */
(function (AFD) {
  "use strict";

  // id prefix -> pricing. Order matters: longer / more specific prefixes first.
  const MODELS = [
    { id: "claude-fable-5-1", name: "Fable 5.1", input: 10, output: 50, cacheRead: 0.25, window: 1000000 },
    { id: "claude-mythos-5-1", name: "Mythos 5.1", input: 10, output: 50, cacheRead: 0.25, window: 1000000 },
    { id: "claude-fable-5", name: "Fable 5", input: 10, output: 50, cacheRead: 1, window: 1000000 },
    { id: "claude-mythos-5", name: "Mythos 5", input: 10, output: 50, cacheRead: 1, window: 1000000 },
    { id: "claude-opus-5-5", name: "Opus 5.5", input: 4, output: 20, cacheRead: 0.2, window: 1000000, fast: 2 },
    { id: "claude-opus-5", name: "Opus 5", input: 5, output: 25, cacheRead: 0.5, window: 1000000, fast: 2 },
    { id: "claude-opus-4-8", name: "Opus 4.8", input: 5, output: 25, cacheRead: 0.5, window: 1000000, fast: 2 },
    { id: "claude-opus-4-7", name: "Opus 4.7", input: 5, output: 25, cacheRead: 0.5, window: 1000000 },
    { id: "claude-opus-4-6", name: "Opus 4.6", input: 5, output: 25, cacheRead: 0.5, window: 1000000 },
    { id: "claude-opus-4-5", name: "Opus 4.5", input: 5, output: 25, cacheRead: 0.5, window: 200000 },
    { id: "claude-opus-4-1", name: "Opus 4.1", input: 15, output: 75, cacheRead: 1.5, window: 200000 },
    { id: "claude-opus-4", name: "Opus 4", input: 15, output: 75, cacheRead: 1.5, window: 200000 },
    { id: "claude-sonnet-5-5", name: "Sonnet 5.5", input: 2, output: 10, cacheRead: 0.1, window: 1000000 },
    { id: "claude-sonnet-5", name: "Sonnet 5", input: 2, output: 10, cacheRead: 0.2, window: 1000000 },
    { id: "claude-sonnet-4-6", name: "Sonnet 4.6", input: 3, output: 15, cacheRead: 0.3, window: 1000000 },
    { id: "claude-sonnet-4-5", name: "Sonnet 4.5", input: 3, output: 15, cacheRead: 0.3, window: 200000 },
    { id: "claude-sonnet-4", name: "Sonnet 4", input: 3, output: 15, cacheRead: 0.3, window: 200000 },
    { id: "claude-3-7-sonnet", name: "Sonnet 3.7", input: 3, output: 15, cacheRead: 0.3, window: 200000 },
    // Haiku 5.5: $0.10/$0.50 up to 100K prompt tokens, $0.50/$2.50 above.
    { id: "claude-haiku-5-5", name: "Haiku 5.5", input: 0.1, output: 0.5, cacheRead: 0.01, window: 1000000,
      longPrompt: { threshold: 100000, input: 0.5, output: 2.5, cacheRead: 0.05 } },
    { id: "claude-haiku-4-5", name: "Haiku 4.5", input: 1, output: 5, cacheRead: 0.1, window: 200000 },
    { id: "claude-3-5-haiku", name: "Haiku 3.5", input: 0.8, output: 4, cacheRead: 0.08, window: 200000 },
  ];

  const WEB_SEARCH_USD = 0.01; // $10 per 1,000 searches

  /** Strip provider prefixes, date suffixes and context suffixes: "us.anthropic.claude-opus-4-1-20250805-v1:0[1m]" -> "claude-opus-4-1" */
  function normalizeModel(raw) {
    if (!raw || typeof raw !== "string") return "";
    let m = raw.trim().toLowerCase();
    m = m.replace(/\[[^\]]*\]$/, "");
    m = m.replace(/^(?:[a-z]{2,4}\.)?anthropic\./, "");
    m = m.replace(/@.*$/, "");
    m = m.replace(/-v\d+(?::\d+)?$/, "");
    m = m.replace(/-\d{8}$/, "");
    return m;
  }

  function findModel(raw) {
    const m = normalizeModel(raw);
    if (!m) return null;
    for (const spec of MODELS) {
      if (m === spec.id || m.startsWith(spec.id + "-")) return spec;
    }
    return null;
  }

  function displayName(raw) {
    const spec = findModel(raw);
    if (spec) return spec.name;
    return raw || "unknown";
  }

  /**
   * Cost of one API response, split by component.
   * usage: Anthropic usage object (input_tokens, output_tokens, cache_read_input_tokens,
   *        cache_creation_input_tokens, cache_creation.{ephemeral_5m_input_tokens, ephemeral_1h_input_tokens}, speed)
   * Returns null when the model is unknown.
   */
  function costOf(usage, rawModel) {
    const spec = findModel(rawModel);
    if (!spec || !usage) return null;
    const input = num(usage.input_tokens);
    const output = num(usage.output_tokens);
    const cacheRead = num(usage.cache_read_input_tokens);
    const cacheWrite = num(usage.cache_creation_input_tokens);
    let write5m = 0;
    let write1h = 0;
    const cc = usage.cache_creation;
    if (cc && (cc.ephemeral_5m_input_tokens != null || cc.ephemeral_1h_input_tokens != null)) {
      write5m = num(cc.ephemeral_5m_input_tokens);
      write1h = num(cc.ephemeral_1h_input_tokens);
      // Any remainder not broken down is treated as a 5-minute write.
      const rest = cacheWrite - write5m - write1h;
      if (rest > 0) write5m += rest;
    } else {
      write5m = cacheWrite;
    }

    let rates = spec;
    const promptTokens = input + cacheRead + cacheWrite;
    if (spec.longPrompt && promptTokens > spec.longPrompt.threshold) rates = Object.assign({}, spec, spec.longPrompt);
    const speedFactor = usage.speed === "fast" && spec.fast ? spec.fast : 1;

    const perTok = (usd) => (usd * speedFactor) / 1e6;
    const parts = {
      input: input * perTok(rates.input),
      cacheWrite: write5m * perTok(rates.input * 1.25) + write1h * perTok(rates.input * 2),
      cacheRead: cacheRead * perTok(rates.cacheRead),
      output: output * perTok(rates.output),
      webSearch: num(usage.server_tool_use && usage.server_tool_use.web_search_requests) * WEB_SEARCH_USD,
    };
    parts.total = parts.input + parts.cacheWrite + parts.cacheRead + parts.output + parts.webSearch;
    return parts;
  }

  /** Cost of sending `tokens` of fresh input once, then re-reading them from cache `reuses` times. */
  function promptCost(tokens, rawModel, opts) {
    const spec = findModel(rawModel);
    if (!spec) return null;
    const o = opts || {};
    const outputTokens = o.outputTokens || 0;
    const first = costOf({ input_tokens: o.cached ? 0 : tokens, cache_creation_input_tokens: o.cached ? tokens : 0, output_tokens: outputTokens }, rawModel);
    const reread = costOf({ cache_read_input_tokens: tokens, output_tokens: outputTokens }, rawModel);
    return { first: first.total, reread: reread.total };
  }

  function num(v) {
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  /** Rough tokens for a character count, for text we cannot tokenize (tool results). ~3 chars per token for code-heavy text. */
  function charsToTokens(chars) {
    return Math.ceil((Number(chars) || 0) / 3);
  }

  AFD.pricing = { MODELS, normalizeModel, findModel, displayName, costOf, promptCost, charsToTokens, WEB_SEARCH_USD };
})(globalThis.AFD = globalThis.AFD || {});

// ── session.js
/* Agent Flight Deck — Claude Code transcript (.jsonl) parser and analysis.
 * Pure functions: no DOM. Works in the browser and in Node (tests).
 *
 * Transcript facts this relies on (checked against real Claude Code logs):
 *  - one JSON object per line; `type` is user | assistant | system | attachment | summary | cost-state | ...
 *  - one API response is split over several `assistant` lines that share `message.id` and repeat the same `usage`
 *  - tool results come back as `user` lines whose content holds `tool_result` blocks (tool_use_id, is_error)
 *  - human prompts are `user` lines with string/text content and no `isMeta`; slash commands are wrapped in <command-name>
 *  - prompts typed while Claude works arrive as `attachment` lines of type `queued_command`
 */
(function (AFD) {
  "use strict";

  const P = () => AFD.pricing;

  const TOOL_CATEGORY = {
    Read: "read", Glob: "read", Grep: "read", LS: "read", NotebookRead: "read",
    Edit: "edit", Write: "edit", MultiEdit: "edit", NotebookEdit: "edit",
    Bash: "run", BashOutput: "run", KillShell: "run", KillBash: "run", Monitor: "run",
    WebFetch: "web", WebSearch: "web",
    Task: "agent", Agent: "agent", Workflow: "agent", SendMessage: "agent",
  };

  function toolCategory(name) {
    if (!name) return "other";
    if (TOOL_CATEGORY[name]) return TOOL_CATEGORY[name];
    if (name.startsWith("mcp__")) return "mcp";
    return "other";
  }

  // ───────────────────────── line parsing ─────────────────────────

  /** Parse JSONL text into entries. Bad lines are counted, not fatal. */
  function parseLines(text, fileName) {
    const entries = [];
    let bad = 0;
    let lineNo = 0;
    let start = 0;
    const len = text.length;
    while (start < len) {
      let end = text.indexOf("\n", start);
      if (end === -1) end = len;
      const line = text.slice(start, end).trim();
      start = end + 1;
      lineNo++;
      if (!line) continue;
      try {
        const obj = JSON.parse(line);
        if (obj && typeof obj === "object") {
          obj.__line = lineNo;
          obj.__file = fileName || "";
          entries.push(obj);
        }
      } catch (e) {
        bad++;
      }
    }
    return { entries, bad };
  }

  const isSubagentFile = (name) => /\/subagents\//.test(name || "") || /(^|\/)agent-[\w-]+\.jsonl$/i.test(name || "");

  /**
   * Group entries from many files into sessions (subagent files share the parent's sessionId).
   * The main transcript keeps its own line order: Claude Code writes some lines out of timestamp order
   * (queued prompts are written seconds later), and reordering them would move turn boundaries.
   * Subagent lines are merged in by timestamp around it.
   */
  function groupSessions(fileResults) {
    const groups = new Map();
    for (const fr of fileResults) {
      const fallback = (fr.fileName || "session").replace(/^.*\//, "").replace(/\.jsonl$/i, "");
      const sid = (fr.entries.find((e) => e.sessionId) || {}).sessionId || fallback;
      if (!groups.has(sid)) groups.set(sid, { id: sid, files: [], main: [], side: [], bad: 0 });
      const g = groups.get(sid);
      g.files.push(fr.fileName);
      g.bad += fr.bad;
      const sub = isSubagentFile(fr.fileName);
      g.seen = g.seen || new Set();
      for (const e of fr.entries) {
        // the same log dropped twice (a file and its folder, a backup copy) must not double the counts
        if (e.uuid) { if (g.seen.has(e.uuid)) continue; g.seen.add(e.uuid); }
        if (sub && e.isSidechain === undefined) e.isSidechain = true;
        (sub ? g.side : g.main).push(e);
      }
    }
    const out = [];
    for (const g of groups.values()) {
      out.push({ id: g.id, files: g.files, bad: g.bad, entries: g.side.length ? mergeByTime(g.main, g.side) : g.main });
    }
    return out;
  }

  /** Merge `side` (sorted by time) into `main` without changing main's order. */
  function mergeByTime(main, side) {
    const sorted = side.map((e, i) => ({ e, t: ts(e.timestamp), i })).sort((a, b) => a.t - b.t || a.i - b.i);
    const out = [];
    let j = 0;
    let lastT = 0;
    for (const e of main) {
      const t = ts(e.timestamp) || lastT;
      while (j < sorted.length && sorted[j].t && sorted[j].t < t) out.push(sorted[j++].e);
      out.push(e);
      lastT = t;
    }
    while (j < sorted.length) out.push(sorted[j++].e);
    return out;
  }

  function ts(v) {
    if (!v) return 0;
    if (typeof v === "number") return v;
    const t = Date.parse(v);
    return Number.isFinite(t) ? t : 0;
  }

  // ───────────────────────── text helpers ─────────────────────────

  function blockText(content) {
    if (content == null) return "";
    if (typeof content === "string") return content;
    if (Array.isArray(content)) {
      return content
        .map((b) => (typeof b === "string" ? b : b && b.type === "text" ? b.text || "" : b && b.type === "image" ? "[image]" : ""))
        .join("\n");
    }
    if (typeof content === "object" && content.text) return String(content.text);
    return "";
  }

  function countLines(s) {
    if (!s) return 0;
    let n = 1;
    for (let i = 0; i < s.length; i++) if (s.charCodeAt(i) === 10) n++;
    return n;
  }

  /** Classify a user-typed string: a real prompt, a slash command, or harness noise. */
  function classifyUserText(text) {
    const t = (text || "").trim();
    if (!t) return null;
    const cmd = t.match(/<command-name>\s*([^<]+?)\s*<\/command-name>/);
    if (cmd) {
      const args = t.match(/<command-args>([\s\S]*?)<\/command-args>/);
      return { kind: "command", text: (cmd[1] + " " + (args ? args[1].trim() : "")).trim() };
    }
    if (/^<(local-command-|system-reminder|bash-stdout|bash-stderr|command-message|task-notification|user-memory-input)/.test(t)) return null;
    if (/^\[Request interrupted by user/.test(t)) return { kind: "interrupt", text: "Interrupted by user" };
    if (/^<bash-input>/.test(t)) return { kind: "command", text: "! " + t.replace(/<\/?bash-input>/g, "").trim() };
    if (/^Caveat: The messages below were generated/.test(t)) return null;
    return { kind: "prompt", text: t };
  }

  function shortPath(p) {
    const parts = String(p).split("/").filter(Boolean);
    return parts.length > 2 ? "…/" + parts.slice(-2).join("/") : p;
  }

  function oneLine(s) {
    return String(s).replace(/\s+/g, " ").trim().slice(0, 200);
  }

  function fmtDur(ms) {
    if (!ms || ms < 0) return "0s";
    const s = Math.round(ms / 1000);
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s";
    const h = Math.floor(m / 60);
    if (h < 48) return h + "h " + String(m % 60).padStart(2, "0") + "m";
    return Math.floor(h / 24) + "d " + (h % 24) + "h";
  }

  function num(v) {
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  /** Convenience: parse one or many {name, text} files into analyzed sessions, newest first. */
  function analyzeFiles(files) {
    const results = files.map((f) => Object.assign({ fileName: f.name }, parseLines(f.text, f.name)));
    const groups = groupSessions(results.filter((r) => r.entries.length));
    const sessions = groups.map((g) => AFD.session.buildSession(g)).filter((s) => s.calls.length || s.events.length);
    sessions.sort((a, b) => b.startT - a.startT);
    const bad = results.reduce((a, r) => a + r.bad, 0);
    const empty = results.filter((r) => !r.entries.length).map((r) => r.fileName);
    return { sessions, bad, empty };
  }

  AFD.session = Object.assign(AFD.session || {}, { parseLines, groupSessions, mergeByTime, analyzeFiles, classifyUserText, toolCategory, fmtDur, shortPath, blockText, ts, countLines, oneLine, num });
})(globalThis.AFD = globalThis.AFD || {});


// ── session-build.js
/* Agent Flight Deck — build an analyzed session (calls, events, tools, turns, files, totals) from grouped log entries. */
(function (AFD) {
  "use strict";

  const P = () => AFD.pricing;
  const { ts, blockText, countLines, classifyUserText, toolCategory, oneLine, num } = AFD.session;

  // ───────────────────────── session build ─────────────────────────

  /**
   * Build an analyzed session from grouped entries.
   * @returns session model (see README in the repo)
   */
  function buildSession(group) {
    const entries = group.entries;
    const calls = [];
    const callById = new Map();
    const events = [];
    const tools = [];
    const toolById = new Map();
    let reportedCost = null;
    let title = "";
    let summary = "";
    const meta = { cwd: "", gitBranch: "", version: "", entrypoint: "" };

    const pushEvent = (ev) => {
      ev.idx = events.length;
      events.push(ev);
      return ev;
    };

    for (const e of entries) {
      const t = ts(e.timestamp);
      if (e.cwd && !meta.cwd) meta.cwd = e.cwd;
      if (e.gitBranch && !meta.gitBranch) meta.gitBranch = e.gitBranch;
      if (e.version) meta.version = e.version;
      if (e.entrypoint && !meta.entrypoint) meta.entrypoint = e.entrypoint;
      const side = !!e.isSidechain;

      switch (e.type) {
        case "assistant": {
          const m = e.message || {};
          const key = m.id || e.requestId || "line:" + e.__file + ":" + e.__line;
          let call = callById.get(key);
          if (!call) {
            call = {
              id: key,
              idx: calls.length,

    el.wbBar.setAttribute("aria-label", `Prompt uses ${tok(used)} of ${tok(cap)} tokens`);
    const totalAll = S.files.reduce((a, f) => a + P().packedTokens(f, S.opts), 0);
    el.wbLegend.innerHTML = `<span><i class="swatch" style="background:var(--ink)"></i> Prompt ${esc(plural(S.prompt.files, "file"))}</span>` +
      (S.reserve ? `<span><i class="swatch" style="background:var(--warn)"></i> Reply ${esc(tok(S.reserve))}</span>` : "") +
      `<span>Whole project ${esc(tok(totalAll))}</span>`;
  }

  function renderTreemap() {
    const el = S.el;
    const box = el.treemap;
    if (!box.isConnected) return;
    clear(box);
    const W = box.clientWidth || 600;
    const H = box.clientHeight || 340;
    let items = S.files.map((f) => ({ value: Math.max(1, P().packedTokens(f, S.opts)), f }));
    items.sort((a, b) => b.value - a.value);
    let rest = null;
    if (items.length > TREEMAP_MAX_CELLS) {
      const tail = items.slice(TREEMAP_MAX_CELLS);
      items = items.slice(0, TREEMAP_MAX_CELLS);
      rest = { value: tail.reduce((a, x) => a + x.value, 0), rest: tail.length };
      items.push(rest);
    }
    const rects = P().squarify(items, 0, 0, W, H);
    const langs = new Map();
    for (const r of rects) {
      const f = r.item.f;
      if (!f) {
        box.appendChild(h("div.tm-cell", { style: { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px", background: "var(--c-other)", cursor: "default" } }, h("span", `${r.item.rest} smaller files`)));
        continue;
      }
      langs.set(f.lang, (langs.get(f.lang) || 0) + r.item.value);
      const cell = h("div.tm-cell" + (f.include ? "" : ".off"), {
        style: { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px", background: LANG_COLOR[f.lang] || LANG_COLOR.other },
        role: "button", tabindex: r.w > 30 && r.h > 18 ? "0" : "-1", "aria-pressed": String(f.include), "aria-label": `${f.path}, ${tok(r.item.value)} tokens`,
      });
      if (r.w > 46 && r.h > 16) cell.appendChild(h("span", f.path.split("/").pop()));
      if (r.w > 46 && r.h > 30) cell.appendChild(h("small", tok(r.item.value)));
      const toggle = () => { f.include = !f.include; renderAll(); };
      cell.addEventListener("click", toggle);
      cell.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      cell.addEventListener("pointermove", (e) => AFD.ui.tip(e, `<b>${esc(f.path)}</b>\n${esc(tok(r.item.value))} tokens · ${esc(String(f.lines))} lines${f.score > 0 ? `\nrelevance ${f.score.toFixed(2)}` : ""}\n${f.include ? "Loaded · click to unload" : "Not loaded · click to load"}`));
      cell.addEventListener("pointerleave", AFD.ui.hideTip);
      box.appendChild(cell);
    }
    if (!S.files.length) box.appendChild(h("div", { style: { padding: "20px", color: "var(--muted)" } }, "No readable text files."));
    const totalAll = S.files.reduce((a, f) => a + P().packedTokens(f, S.opts), 0);
    el.tmTitle.textContent = `${plural(S.files.length, "file")} · ${tok(totalAll)} tokens${S.isExample ? " · example project" : ""}`;
    el.tmLegend.innerHTML = [...langs.entries()].sort((a, b) => b[1] - a[1]).map(([l, v]) => `<span><i class="swatch" style="background:${LANG_COLOR[l] || LANG_COLOR.other}"></i>${esc(LANG_NAME[l] || l)} ${esc(tok(v))}</span>`).join("") +
      `<span><i class="swatch" style="background:var(--line);background-image:repeating-linear-gradient(-45deg,transparent,transparent 2px,var(--faint) 2px,var(--faint) 3px)"></i>Not loaded</span>`;
  }

  function renderManifest() {
    const el = S.el;
    clear(el.manifest);
    const rows = L.shownFiles();
    const loaded = S.files.filter((f) => f.include).length;
    el.manifestCount.textContent = `${loaded} of ${S.files.length} loaded`;
    const maxScore = Math.max(...S.files.map((f) => f.score), 0);
    const hasScore = maxScore > 0;
    const cols = [
      { key: "include", label: "", sortable: false, render: (r) => {
        const box = h("input", { type: "checkbox", checked: r.include, "aria-label": "Load " + r.path });
        box.addEventListener("click", (e) => e.stopPropagation());
        box.addEventListener("change", () => { r.include = box.checked; renderAll(); });
        return box;
      } },
      { key: "path", label: "File", render: (r) => h("div.path", { title: r.secretHint ? r.path + " — looks like it contains a key or token; check before sending it to a model" : r.path }, h("bdi", (r.secretHint ? "⚠ " : "") + r.path)), ascFirst: true },
      { key: "lang", label: "Type", render: (r) => h("span", { style: { display: "inline-flex", alignItems: "center", gap: "5px", whiteSpace: "nowrap" } }, h("i.swatch", { style: { background: LANG_COLOR[r.lang] || LANG_COLOR.other } }), LANG_NAME[r.lang] || r.lang) },
      { key: "tokens", label: "≈Tokens", num: true, render: (r) => tok(P().packedTokens(r, S.opts)), sort: (r) => P().packedTokens(r, S.opts) },
    ];
    if (hasScore) cols.push({ key: "score", label: "Relevance", render: (r) => h("span", { title: r.score.toFixed(2) }, h("i.score", { style: { width: Math.max(2, (r.score / maxScore) * 70) + "px", opacity: r.score > 0 ? 1 : 0.2 } })) });
    el.manifest.appendChild(AFD.ui.table(cols, rows, { sortKey: hasScore ? "score" : "tokens", onRow: (r) => { r.include = !r.include; renderAll(); }, limit: 3000 }));
  }

  function renderPrompt() {
    const el = S.el;
    const p = S.prompt;
    const text = p.text;
    el.promptStats.textContent = `${plural(p.files, "file")} · ≈${tok(p.tokens)} tokens · ${text.length.toLocaleString("en-US")} chars`;
    const HEAD = 6000;
    const TAIL = 1500;
    el.preview.textContent = p.files
      ? text.length > HEAD + TAIL + 200
        ? text.slice(0, HEAD) + `\n\n  ⋯ ${(text.length - HEAD - TAIL).toLocaleString("en-US")} characters not shown here; Copy prompt copies everything ⋯\n\n` + text.slice(-TAIL)
        : text
      : "Load some files to build the prompt.";
    el.copyBtn.disabled = !p.files;

    clear(el.costs);
    el.costs.appendChild(h("span.h", "Input cost of this prompt"));
    el.costs.appendChild(h("span.h.num", "First send"));
    el.costs.appendChild(h("span.h.num", { title: "Each later request that reuses the same prompt prefix from the prompt cache" }, "Cached re-send"));
    for (const m of PRICE_MODELS) {
      const c = AFD.pricing.promptCost(p.tokens, m);
      if (!c) continue;
      el.costs.appendChild(h("span", AFD.pricing.displayName(m)));
      el.costs.appendChild(h("span.num", usd(c.first)));
      el.costs.appendChild(h("span.num", usd(c.reread)));
    }

    clear(el.skipped);
    if (S.skipped.length) {
      const groups = new Map();
      for (const s of S.skipped) {
        if (!groups.has(s.reason)) groups.set(s.reason, []);
        groups.get(s.reason).push(s);
      }
      el.skipped.appendChild(h("summary", `${plural(S.skipped.length, "file")} left out: ` + [...groups.entries()].map(([r, list]) => `${list.length} ${r}`).join(", ")));
      el.skipped.appendChild(h("ul", S.skipped.slice(0, 400).map((s) => h("li", `${s.path}  (${s.reason})`))));
    }
  }

  Object.assign(L, { renderAll, renderManifest, renderPrompt, renderTreemap, renderWB });
})(globalThis.AFD = globalThis.AFD || {});

// ── app.js
/* Agent Flight Deck — app shell: tabs, hash routing, theme toggle. */
(function (AFD) {
  "use strict";
  const { h } = AFD.ui;

  const VIEWS = [
    { id: "recorder", label: "Flight Recorder", mod: () => AFD.recorder },
    { id: "loadsheet", label: "Load Sheet", mod: () => AFD.loadsheet },
  ];

  function boot() {
    const tabs = document.getElementById("tabs");
    const main = document.getElementById("main");
    const mounted = new Set();
    const panes = {};
    const buttons = {};

    for (const v of VIEWS) {
      panes[v.id] = h("section.view", { id: "view-" + v.id, role: "tabpanel", "aria-labelledby": "tab-" + v.id, hidden: true });
      main.appendChild(panes[v.id]);
      buttons[v.id] = h("button.tab", { type: "button", role: "tab", id: "tab-" + v.id, "aria-controls": "view-" + v.id, "aria-selected": "false", onclick: () => go(v.id) }, h("i.tab-dot"), v.label);
      tabs.appendChild(buttons[v.id]);
    }

    function show(id) {
      if (!panes[id]) id = VIEWS[0].id;
      for (const v of VIEWS) {
        const on = v.id === id;
        panes[v.id].hidden = !on;
        buttons[v.id].setAttribute("aria-selected", String(on));
        if (!on && mounted.has(v.id) && v.mod().onHide) v.mod().onHide();
      }
      const v = VIEWS.find((x) => x.id === id);
      if (!mounted.has(id)) {
        mounted.add(id);
        try {
          v.mod().mount(panes[id]);
        } catch (err) {
          panes[id].appendChild(h("div.notice.err", "This view failed to start: " + (err && err.message ? err.message : err)));
          console.error(err);
        }
      } else if (v.mod().onShow) v.mod().onShow();
      document.title = v.label === "Flight Recorder" ? "Agent Flight Deck" : "Agent Flight Deck · " + v.label;
      AFD.ui.setPref("tab", id);
    }

    function go(id) {
      if (location.hash !== "#" + id) location.hash = id;
      else show(id);
    }

    window.addEventListener("hashchange", () => show(location.hash.slice(1)));
    const start = location.hash.slice(1) || AFD.ui.pref("tab", VIEWS[0].id);
    show(start);

    // theme toggle: follows the system until the viewer picks one
    const themeBtn = document.getElementById("theme");
    const applyTheme = (t) => {
      if (t) document.documentElement.setAttribute("data-theme", t);
      else document.documentElement.removeAttribute("data-theme");
      const dark = t ? t === "dark" : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      themeBtn.innerHTML = AFD.ui.ICONS[dark ? "sun" : "moon"];
      themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    };
    let theme = AFD.ui.pref("theme", null);
    applyTheme(theme);
    themeBtn.addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      theme = dark ? "light" : "dark";
      AFD.ui.setPref("theme", theme);
      applyTheme(theme);
    });

    // dropping a file anywhere on the page should never navigate away from the app
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(globalThis.AFD = globalThis.AFD || {});

</script>
